
spring.application.name=coffee-flower-bff

# Configuración del servidor
server.port=${PORT:8080}

# Configuración de la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:https://coffee-flower-frontend.vercel.app}

# Seguridad del API Gateway
app.gateway.secret=${GATEWAY_SECRET}

# Amazon SNS: tópico para eventos de pedidos
app.aws.sns.topic-arn=${SNS_TOPIC_ARN:}

# Amazon SNS: tópico exclusivo para informes mensuales
app.aws.sns.report-topic-arn=${AWS_SNS_TOPIC_ARN:}

