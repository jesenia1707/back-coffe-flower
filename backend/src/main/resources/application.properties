spring.application.name=coffee-flower-bff

# Configuración del servidor
server.port=${PORT:8080}

# Configuración de la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:https://coffee-flower-frontend.vercel.app}

# Seguridad del API Gateway
app.gateway.secret=${GATEWAY_SECRET}

# Configuración AWS SNS: tópico de eventos de pedidos
app.aws.sns.topic-arn=arn:aws:sns:us-east-1:533266979335:coffee-flower-pedido-events