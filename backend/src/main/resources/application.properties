
spring.application.name=coffee-flower-bff

# Configuración del servidor
server.port=${PORT:8080}

# Configuración de la base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuración CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:https://coffee-flower-frontend.vercel.app}

# Seguridad del API Gateway
app.gateway.secret=${GATEWAY_SECRET}

# Configuración AWS SNS: tópico de eventos de pedidos
app.aws.sns.topic-arn=${SNS_TOPIC_ARN:}

# Informe PDF de compras y correo SMTP
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Correo que recibirá el informe
app.report.email=${REPORT_EMAIL:}
